name: openfashion
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  crystal_navigation_bar: ^1.0.0
  iconly: ^1.0.1
  provider: ^6.1.5+1
  image_picker: ^1.1.2
  google_fonts: ^6.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.3.0
  iconsax: ^0.0.8
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  hugeicons: ^1.1.5
  firebase_storage: ^13.0.6
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/Search.svg
    - assets/svg/

  fonts:
    - family: TenorSans
      fonts:
        - asset: assets/fonts/TenorSans-Regular.ttf
